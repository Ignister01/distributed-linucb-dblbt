name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment/requirements.lock
      - name: Install
        run: |
          python -m pip install -r environment/requirements.lock
          python -m pip install --no-deps -e .
      - name: Test
        run: python -m pytest -q
      - name: Check shell scripts
        run: |
          bash -n scripts/bootstrap_linux.sh
          bash -n scripts/run_smoke.sh
          bash -n scripts/run_overnight.sh
          bash -n scripts/run_ns3_gate.sh
          bash -n scripts/run_ns3_validation.sh
