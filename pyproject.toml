[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "dblbt-fcn"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["hypothesis>=6.110,<7", "pytest>=8.3,<9", "pytest-cov>=5,<7"]

[project.scripts]
dblbt-fcn = "dblbt_fcn.cli:app"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/dblbt_fcn"]

[tool.hatch.build.targets.wheel.force-include]
"configs/matrices" = "dblbt_fcn/matrices"
